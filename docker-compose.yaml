services:
  todoapp-postgres:
    image: postgres18
    container_name: todoapp-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_TODOAPP_USER}
      - POSTGRES_PASSWORD=${POSTGRES_TODOAPP_PASSWORD}
      - POSTGRES_DB=${POSTGRES_TODOAPP_DB}
    volumes:
      - ${PROJECT_TODOAPP_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_TODOAPP_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:5435:5432"